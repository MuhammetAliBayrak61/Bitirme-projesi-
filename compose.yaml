services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: lst
      POSTGRES_USER: lst
      POSTGRES_PASSWORD: ${LST_DB_PASSWORD:?LST_DB_PASSWORD gerekli}
    volumes:
      - lstdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U lst"]
      interval: 4s
      timeout: 4s
      retries: 25
  seed:
    image: python:3.12-slim
    working_dir: /project
    volumes:
      - .:/project:ro
    environment:
      PGHOST: db
      PGUSER: lst
      PGDATABASE: lst
      PGPASSWORD: ${LST_DB_PASSWORD}
      DATABASE_URL: ""
    command: ["sh","-c","pip install --quiet 'psycopg[binary]>=3.2,<4' && python scripts/publish.py"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: .
    environment:
      ConnectionStrings__Lst: Host=db;Database=lst;Username=lst
      PGPASSWORD: ${LST_DB_PASSWORD}
    ports:
      - "127.0.0.1:5274:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
volumes:
  lstdata:
